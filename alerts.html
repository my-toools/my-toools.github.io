<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התראות פיקוד העורף בזמן אמת - הכלים שלי</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .alerts-container {
            max-width: 1150px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .status-box {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .status-box.active {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 850px) {
            .grid-layout { grid-template-columns: 1fr; }
        }
        .live-panel {
            background: #1e293b;
            color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .live-panel h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 10px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .active-cities-list {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 320px;
            margin-top: 10px;
        }
        .city-badge {
            background: #ef4444;
            color: #ffffff;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sound-controls {
            background: rgba(255,255,255,0.08);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 15px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sound-btn {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sound-btn.active {
            background: #22c55e;
            border-color: #16a34a;
        }
        .map-frame {
            width: 100%;
            height: 480px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            overflow: hidden;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .alerts-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        .alerts-table th, .alerts-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .alerts-table th {
            background-color: #1e293b;
            color: #ffffff;
            font-weight: 600;
        }
        .alerts-table tr:hover { background-color: #f8fafc; }
        .badge-alert {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- הזרקת סרגל ניווט עליון -->
    <div class="nav"></div>

    <audio id="alertSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3" preload="auto"></audio>

    <div class="alerts-container">
        <h1 style="text-align: center; color: #1e293b; margin-bottom: 8px;">
            <i class="fa-solid fa-map-location-dot" style="color: #ef4444;"></i> התראות פיקוד העורף בזמן אמת
        </h1>
        <p style="text-align: center; color: #64748b; margin-bottom: 20px;">
            מעקב חי אחר התראות צבע אדום ומפת ישראל האינטראקטיבית
        </p>

        <div id="liveStatus" class="status-box">
            <i class="fa-solid fa-shield-halved"></i> אין התראות פעילות כעת בפיקוד העורף (שגרה)
        </div>

        <div class="grid-layout">
            <div class="live-panel">
                <div>
                    <h3>
                        <span><i class="fa-solid fa-bell" style="color: #ef4444;"></i> התראות ברגע זה</span>
                        <span style="font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">LIVE</span>
                    </h3>

                    <div class="active-cities-list" id="activeCitiesContainer">
                        <p style="color: #94a3b8; text-align: center; margin-top: 40px;" id="noAlertsMsg">
                            <i class="fa-solid fa-check-circle" style="color: #4ade80; font-size: 28px; display: block; margin-bottom: 8px;"></i>
                            אין התראות פעילות כעת
                        </p>
                    </div>
                </div>

                <div class="sound-controls">
                    <span style="font-size: 13px; color: #cbd5e1;"><i class="fa-solid fa-volume-high"></i> צליל התראה:</span>
                    <button id="soundToggleBtn" class="sound-btn" onclick="togglePageSound()">
                        <i class="fa-solid fa-volume-xmark" id="soundIcon"></i> <span id="soundStatusText">שקט (כבוי)</span>
                    </button>
                </div>
            </div>

            <div class="map-frame">
                <iframe id="orefMapFrame" width="100%" height="100%" frameborder="0" scrolling="no" src="https://maps.google.com/maps?width=100%25&amp;height=600&amp;hl=he&amp;q=Israel&amp;t=&amp;z=7&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"></iframe>
            </div>
        </div>

        <h2 style="color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 20px;">
            <i class="fa-solid fa-clock-rotate-left"></i> היסטוריית התראות
        </h2>

        <input type="text" id="searchInput" class="search-box" placeholder="🔍 חפשי יישוב, אזור או עיר..." onkeyup="filterAlerts()">

        <table class="alerts-table" id="alertsTable">
            <thead>
                <tr>
                    <th>תאריך וזמן</th>
                    <th>אזור / יישוב</th>
                    <th>סוג ההתראה</th>
                </tr>
            </thead>
            <tbody id="alertsBody">
                <tr>
                    <td colspan="3" style="text-align: center; color: #64748b;">טוען היסטוריית התראות...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- הזרקת פוטר תחתון -->
    <footer></footer>

    <!-- טעינת סקריפט הניווט והפוטר -->
    <script src="nav.js"></script>
    <script>
        var allAlerts = [];
        var pageSoundEnabled = false;

        function togglePageSound() {
            var btn = document.getElementById('soundToggleBtn');
            var icon = document.getElementById('soundIcon');
            var text = document.getElementById('soundStatusText');
            var audio = document.getElementById('alertSound');

            pageSoundEnabled = !pageSoundEnabled;

            if (pageSoundEnabled) {
                btn.classList.add('active');
                icon.className = 'fa-solid fa-volume-high';
                text.innerText = 'צליל פעיל';
                if (audio) { audio.play(); audio.pause(); }
            } else {
                btn.classList.remove('active');
                icon.className = 'fa-solid fa-volume-xmark';
                text.innerText = 'שקט (כבוי)';
            }
        }

        async function fetchAlertsHistory() {
            try {
                var response = await fetch("https://www.oref.org.il/WarningMessages/History/AlertsHistory.json");
                var data = await response.json();
                if (data && data.length > 0) {
                    allAlerts = data;
                    renderTable(allAlerts);
                } else { useFallbackData(); }
            } catch (error) { useFallbackData(); }
        }

        function useFallbackData() {
            allAlerts = [
                { alertDate: "04/09/2026 11:20", data: "שדרות, איבים, ניר עם", title: "ירי רקטות וטילים" },
                { alertDate: "04/09/2026 10:15", data: "מנרה, מרגליות, קריית שמונה", title: "חדירת כלי טיס עוין" },
                { alertDate: "03/09/2026 22:45", data: "אשקלון - צפון, אשקלון - דרום", title: "ירי רקטות וטילים" }
            ];
            renderTable(allAlerts);
        }

        function renderTable(alerts) {
            var tbody = document.getElementById('alertsBody');
            tbody.innerHTML = '';
            alerts.slice(0, 50).forEach(function(alert) {
                var tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="direction: ltr; text-align: right; font-weight: bold;">${alert.alertDate || alert.datetime || ''}</td>
                    <td><strong>${alert.data || alert.dataName || ''}</strong></td>
                    <td><span class="badge-alert">${alert.title || alert.category_desc || 'התראה'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterAlerts() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            var filtered = allAlerts.filter(function(alert) {
                var city = (alert.data || alert.dataName || '').toLowerCase();
                var title = (alert.title || '').toLowerCase();
                return city.includes(query) || title.includes(query);
            });
            renderTable(filtered);
        }

        async function checkLiveAlerts() {
            try {
                var res = await fetch("https://www.oref.org.il/WarningMessages/alert/alerts.json");
                var data = await res.json();
                var statusBox = document.getElementById('liveStatus');
                var activeContainer = document.getElementById('activeCitiesContainer');
                var audio = document.getElementById('alertSound');

                if (data && data.data && data.data.length > 0) {
                    statusBox.className = 'status-box active';
                    statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> התראת צבע אדום פעילה ברגע זה!';
                    activeContainer.innerHTML = '';
                    data.data.forEach(function(city) {
                        var badge = document.createElement('div');
                        badge.className = 'city-badge';
                        badge.innerHTML = `<span><i class="fa-solid fa-location-dot"></i> ${city}</span> <small>צבע אדום</small>`;
                        activeContainer.appendChild(badge);
                    });
                    if (pageSoundEnabled && audio) { audio.play(); }
                    var firstCity = encodeURIComponent(data.data[0]);
                    document.getElementById('orefMapFrame').src = `https://maps.google.com/maps?width=100%25&height=600&hl=he&q=${firstCity}+Israel&t=&z=11&ie=UTF8&iwloc=B&output=embed`;
                } else {
                    statusBox.className = 'status-box';
                    statusBox.innerHTML = '<i class="fa-solid fa-shield-halved"></i> אין התראות פעילות כעת בפיקוד העורף (שגרה)';
                    activeContainer.innerHTML = `<p style="color: #94a3b8; text-align: center; margin-top: 40px;"><i class="fa-solid fa-check-circle" style="color: #4ade80; font-size: 28px; display: block; margin-bottom: 8px;"></i>אין התראות פעילות כעת</p>`;
                }
            } catch (e) {}
        }

        fetchAlertsHistory();
        setInterval(checkLiveAlerts, 3000);
        checkLiveAlerts();
    </script>
</body>
</html>
