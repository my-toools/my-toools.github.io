<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרכז ההתרעות והחירום - NETOOLS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; line-height: 1.6;">

    <main style="max-width: 900px; margin: 30px auto; padding: 20px;">
        <div style="background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; text-align: center; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);">
            <h1 style="color: #ef4444; margin: 0 0 10px 0; font-size: 24px;"><i class="fa-solid fa-bell"></i> מרכז ההתרעות והחירום בזמן אמת</h1>
            <p style="color: #94a3b8; margin: 0;">עדכוני פיקוד העורף, התרעות מקדימות והודעות סיום אירוע</p>
        </div>

        <div id="alerts-container">
            <!-- התרעה מקדימה / חירום (אדום) -->
            <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; padding: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444; font-size: 24px;"></i>
                <div>
                    <strong style="color: #f87171; font-size: 16px; display: block;">ירי רקטות וטילים (התרעה מקדימה)</strong>
                    <span style="color: #cbd5e1; font-size: 14px;">אשקלון, לכיש, עוטף עזה</span>
                </div>
            </div>

            <!-- התרעת סיום אירוע / חזרה לשגרה (ירוק) -->
            <div style="background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.4); border-radius: 12px; padding: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                <i class="fa-solid fa-circle-check" style="color: #4ade80; font-size: 24px;"></i>
                <div>
                    <strong style="color: #4ade80; font-size: 16px; display: block;">סיום אירוע - חזרה לשגרה</strong>
                    <span style="color: #cbd5e1; font-size: 14px;">אשקלון, לכיש</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // פונקציה להוספת התרעות בלייב ושמירה על העיצוב בדיוק
        function addAlert(title, cities, time) {
            const isSuccess = title.includes("סיום") || title.includes("שגרה") || title.includes("הסתיים");

            const bgColor = isSuccess ? "rgba(34, 197, 94, 0.1)" : "rgba(239, 68, 68, 0.1)";
            const borderColor = isSuccess ? "rgba(34, 197, 94, 0.4)" : "rgba(239, 68, 68, 0.4)";
            const textColor = isSuccess ? "#4ade80" : "#f87171";
            const iconClass = isSuccess ? "fa-circle-check" : "fa-triangle-exclamation";

            const alertHtml = `
                <div style="background: ${bgColor}; border: 1px solid ${borderColor}; border-radius: 12px; padding: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px;">
                    <i class="fa-solid ${iconClass}" style="color: ${textColor}; font-size: 24px;"></i>
                    <div>
                        <strong style="color: ${textColor}; font-size: 16px; display: block;">${title}</strong>
                        <span style="color: #cbd5e1; font-size: 14px;">${cities}</span>
                        ${time ? `<small style="display:block; color:#94a3b8; font-size:12px; margin-top:4px;">${time}</small>` : ''}
                    </div>
                </div>
            `;

            const container = document.getElementById("alerts-container");
            if (container) {
                container.insertAdjacentHTML("afterbegin", alertHtml);
            }
        }
    </script>

    <script src="header.js"></script>
</body>
</html>
