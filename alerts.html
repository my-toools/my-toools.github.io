<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מרכז ההתרעות והחירום  - NETOOLS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .alerts-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .alerts-header {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .alerts-header h1 {
            font-size: 2rem;
            color: #f8fafc;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .alerts-header p {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        .alerts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .alerts-grid {
                grid-template-columns: 1fr;
            }
        }

        .alert-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .card-title {
            font-size: 1.25rem;
            color: #f8fafc;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .live-alerts-list, .history-alerts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .alert-item {
            background: rgba(15, 23, 42, 0.6);
            border-right: 4px solid #ef4444;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-item.normal {
            border-right-color: #3b82f6;
        }

        .alert-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .alert-title-text {
            color: #f8fafc;
            font-weight: bold;
            font-size: 1rem;
        }

        .alert-cities {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .alert-time {
            color: #64748b;
            font-size: 0.85rem;
            direction: ltr;
        }

        .map-container {
            width: 100%;
            height: 350px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .history-section {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .banner-alert {
            background: #dc2626;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- סרגל התרעה חיה עליון -->
    <div id="liveBanner" class="banner-alert">
        <i class="fa-solid fa-triangle-exclamation"></i> התרעת צבע אדום פעילה כעת!
    </div>

    <div class="alerts-container">
        
        <!-- כותרת ראשית -->
        <div class="alerts-header">
            <h1><i class="fa-solid fa-bell text-red-500"></i> מרכז ההתרעות והחירום הארצי</h1>
            <p>מערכת מעקב וניטור בזמן אמת אחר נתוני פיקוד העורף וארכיון התרעות עצמאי</p>
        </div>

        <div class="alerts-grid">
            <!-- מפת ישראל -->
            <div class="alert-card">
                <div class="card-title">
                    <i class="fa-solid fa-map-location-dot text-blue-400"></i> מפת ארץ ישראל
                </div>
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3380.9768652230115!2d34.781768!3d32.085300!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzLCsDA1JzA3LjEiTiAzNMKwNDYnNTQuNCJF!5e0!3m2!1she!2sil!4v1620000000000!5m2!1she!2sil" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <!-- אזעקות פעילות כעת -->
            <div class="alert-card">
                <div class="card-title">
                    <i class="fa-solid fa-bell text-red-400"></i> אזעקות פעילות כעת
                </div>
                <div id="liveAlertsContainer" class="live-alerts-list">
                    <!-- ייטען דינמית -->
                </div>
            </div>
        </div>

        <!-- היסטוריית התרעות -->
        <div class="history-section">
            <div class="card-title">
                <i class="fa-solid fa-clock-rotate-left text-blue-400"></i> היסטוריית התרעות
            </div>
            <div id="historyAlertsContainer" class="history-alerts-list">
                <!-- ייטען דינמית מ-Supabase -->
            </div>
        </div>

    </div>

    <script>
        let historicalAlerts = [];

        async function fetchAlerts() {
            try {
                const response = await fetch('https://api.netools.co.il/api/alerts');
                if (response.ok) {
                    const data = await response.json();
                    
                    if (Array.isArray(data) && data.length > 0) {
                        historicalAlerts = data.map(item => ({
                            title: item.title || 'התרעת פיקוד העורף',
                            data: Array.isArray(item.data) ? item.data : [item.data || 'יישוב/אזור'],
                            date: item.date || '',
                            time: item.time || ''
                        }));
                    } else {
                        historicalAlerts = [];
                    }
                }
            } catch (e) {
                console.error('Error fetching alerts:', e);
                historicalAlerts = [];
            }
            
            renderAlerts();
        }

        function renderAlerts() {
            const liveContainer = document.getElementById('liveAlertsContainer');
            const historyContainer = document.getElementById('historyAlertsContainer');
            const liveBanner = document.getElementById('liveBanner');

            liveContainer.innerHTML = '';
            historyContainer.innerHTML = '';

            if (historicalAlerts.length === 0) {
                liveContainer.innerHTML = '<div class="alert-item normal"><div class="alert-info"><span class="alert-title-text">שגרה מלאה</span><span class="alert-cities">אין התרעות פעילות כעת</span></div></div>';
                historyContainer.innerHTML = '<div class="alert-item normal"><div class="alert-info"><span class="alert-title-text">אין נתונים בהיסטוריה</span></div></div>';
                liveBanner.style.display = 'none';
                return;
            }

            // רנדור הרשימה
            historicalAlerts.forEach((item, index) => {
                const citiesText = Array.isArray(item.data) ? item.data.join(', ') : item.data;
                const alertHtml = `
                    <div class="alert-item ${index === 0 && item.title.includes('פעילה') ? '' : 'normal'}">
                        <div class="alert-info">
                            <span class="alert-title-text">${item.title}</span>
                            <span class="alert-cities">יישובים: ${citiesText}</span>
                        </div>
                        <div class="alert-time">${item.time} | ${item.date}</div>
                    </div>
                `;

                if (index === 0) {
                    liveContainer.innerHTML = alertHtml;
                }
                historyContainer.innerHTML += alertHtml;
            });
        }

        // טעינה ראשונית ועדכון מחזורי כל 3 שניות
        fetchAlerts();
        setInterval(fetchAlerts, 3000);
    </script>
</body>
</html>
