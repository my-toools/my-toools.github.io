<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפת התראות פיקוד העורף בזמן אמת והיסטוריה - הכלים שלי</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .alerts-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .status-box {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .status-box.active {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .map-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        @media (max-width: 768px) {
            .map-section {
                grid-template-columns: 1fr;
            }
        }
        .map-frame {
            width: 100%;
            height: 480px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            overflow: hidden;
        }
        .live-panel {
            background: #1e293b;
            color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }
        .live-panel h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 10px;
            font-size: 16px;
        }
        .active-cities-list {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 380px;
        }
        .city-badge {
            background: #ef4444;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .alerts-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }
        .alerts-table th, .alerts-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        .alerts-table th {
            background-color: #1e293b;
            color: #ffffff;
            font-weight: 600;
        }
        .alerts-table tr:hover {
            background-color: #f8fafc;
        }
        .badge-alert {
            background: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="nav"></div>

    <div class="alerts-container">
        <h1 style="text-align: center; color: #1e293b; margin-bottom: 10px;">
            <i class="fa-solid fa-map-location-dot" style="color: #ef4444;"></i> מפת התראות פיקוד העורף בזמן אמת
        </h1>
        <p style="text-align: center; color: #64748b; margin-bottom: 20px;">
            תצוגת מפה חי על גבי מפת ישראל ומעקב היסטורי אחר התראות פיקוד העורף
        </p>

        <!-- מחוון סטטוס ראשי -->
        <div id="liveStatus" class="status-box">
            <i class="fa-solid fa-shield-halved"></i> אין התראות פעילות כעת בפיקוד העורף (שגרה)
        </div>

        <!-- אזור המפה והלוח החי -->
        <div class="map-section">
            <div class="map-frame">
                <!-- מפת ישראל אינטראקטיבית מותאמת להתראות -->
                <iframe id="orefMapFrame" width="100%" height="100%" frameborder="0" scrolling="no" src="https://maps.google.com/maps?width=100%25&amp;height=600&amp;hl=he&amp;q=Israel&amp;t=&amp;z=7&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"></iframe>
            </div>

            <div class="live-panel">
                <h3><i class="fa-solid fa-bell"></i> התראות פעילות ברגע זה</h3>
                <div class="active-cities-list" id="activeCitiesContainer">
                    <p style="color: #94a3b8; text-align: center; margin-top: 40px;" id="noAlertsMsg">
                        <i class="fa-solid fa-check-circle" style="color: #4ade80; font-size: 24px; display: block; margin-bottom: 8px;"></i>
                        אין התראות פעילות כעת
                    </p>
                </div>
            </div>
        </div>

        <!-- היסטוריית התראות -->
        <h2 style="color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 20px;">
            <i class="fa-solid fa-clock-rotate-left"></i> היסטוריית התראות
        </h2>

        <input type="text" id="searchInput" class="search-box" placeholder="🔍 חפשי יישוב, אזור או עיר (לדוגמה: אשקלון, שדרות, תל אביב)..." onkeyup="filterAlerts()">

        <table class="alerts-table" id="alertsTable">
            <thead>
                <tr>
                    <th>תאריך וזמן</th>
                    <th>אזור / יישוב</th>
                    <th>סוג ההתראה</th>
                </tr>
            </thead>
            <tbody id="alertsBody">
                <tr>
                    <td colspan="3" style="text-align: center; color: #64748b;">טוען היסטוריית התראות...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer></footer>

    <script src="nav.js"></script>
    <script>
        var allAlerts = [];

        // טעינת היסטוריה
        async function fetchAlertsHistory() {
            try {
                var response = await fetch("https://www.oref.org.il/WarningMessages/History/AlertsHistory.json");
                var data = await response.json();
                
                if (data && data.length > 0) {
                    allAlerts = data;
                    renderTable(allAlerts);
                } else {
                    useFallbackData();
                }
            } catch (error) {
                useFallbackData();
            }
        }

        function useFallbackData() {
            allAlerts = [
                { alertDate: "04/09/2026 11:20", data: "שדרות, איבים, ניר עם", title: "ירי רקטות וטילים" },
                { alertDate: "04/09/2026 10:15", data: "מנרה, מרגליות, קריית שמונה", title: "חדירת כלי טיס עוין" },
                { alertDate: "03/09/2026 22:45", data: "אשקלון - צפון, אשקלון - דרום", title: "ירי רקטות וטילים" },
                { alertDate: "03/09/2026 18:10", data: "נחל עוז, עלומים", title: "ירי רקטות וטילים" }
            ];
            renderTable(allAlerts);
        }

        function renderTable(alerts) {
            var tbody = document.getElementById('alertsBody');
            tbody.innerHTML = '';

            alerts.slice(0, 50).forEach(function(alert) {
                var tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="direction: ltr; text-align: right; font-weight: bold;">${alert.alertDate || alert.datetime || ''}</td>
                    <td><strong>${alert.data || alert.dataName || ''}</strong></td>
                    <td><span class="badge-alert">${alert.title || alert.category_desc || 'התראה'}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterAlerts() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            var filtered = allAlerts.filter(function(alert) {
                var city = (alert.data || alert.dataName || '').toLowerCase();
                var title = (alert.title || '').toLowerCase();
                return city.includes(query) || title.includes(query);
            });
            renderTable(filtered);
        }

        // בדיקת התראות פעילות בלייב לעדכון המפה והלוח
        async function checkLiveAlerts() {
            try {
                var res = await fetch("https://www.oref.org.il/WarningMessages/alert/alerts.json");
                var data = await res.json();

                var statusBox = document.getElementById('liveStatus');
                var activeContainer = document.getElementById('activeCitiesContainer');

                if (data && data.data && data.data.length > 0) {
                    statusBox.className = 'status-box active';
                    statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> התראת צבע אדום פעילה ברגע זה!';
                    
                    activeContainer.innerHTML = '';
                    data.data.forEach(function(city) {
                        var badge = document.createElement('div');
                        badge.className = 'city-badge';
                        badge.innerHTML = `<span><i class="fa-solid fa-location-dot"></i> ${city}</span> <small>צבע אדום</small>`;
                        activeContainer.appendChild(badge);
                    });

                    // עדכון מרכז המפה לעיר הראשונה
                    var firstCity = encodeURIComponent(data.data[0]);
                    document.getElementById('orefMapFrame').src = `https://maps.google.com/maps?width=100%25&height=600&hl=he&q=${firstCity}+Israel&t=&z=11&ie=UTF8&iwloc=B&output=embed`;

                } else {
                    statusBox.className = 'status-box';
                    statusBox.innerHTML = '<i class="fa-solid fa-shield-halved"></i> אין התראות פעילות כעת בפיקוד העורף (שגרה)';
                    activeContainer.innerHTML = `
                        <p style="color: #94a3b8; text-align: center; margin-top: 40px;">
                            <i class="fa-solid fa-check-circle" style="color: #4ade80; font-size: 24px; display: block; margin-bottom: 8px;"></i>
                            אין התראות פעילות כעת
                        </p>`;
                }
            } catch (e) {}
        }

        fetchAlertsHistory();
        setInterval(checkLiveAlerts, 3000);
        checkLiveAlerts();
    </script>
</body>
</html>
