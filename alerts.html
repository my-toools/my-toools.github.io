<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התרעות חירום בזמן אמת - NETOOLS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, input, select, button, div, p, span, h1, h2, h3 { font-family: 'Rubik', sans-serif; box-sizing: border-box; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        
        /* פס התרעה אדום עליון שנדלק רק בהתרעה פעילה ובמצב מלא */
        #live-alert-banner {
            background: #dc2626; color: white; padding: 12px; text-align: center;
            font-weight: 700; font-size: 16px; display: none; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.5); animation: pulse-bg 1s infinite alternate;
        }
        @keyframes pulse-bg { 0% { background: #b91c1c; } 100% { background: #ef4444; } }

        .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h1 { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #f8fafc; }
        .form-control { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; font-size: 14px; }
        .alert-item { background: #0f172a; border-right: 4px solid #ef4444; padding: 12px 15px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <!-- פס התרעה עליון (מוצג רק אם יש אזעקה והמשתמש בחר התרעה מלאה) -->
    <div id="live-alert-banner">
        <i class="fa-solid fa-triangle-exclamation"></i> <span id="banner-text">התרעת צבע אדום פעילה כעת באזורך!</span>
    </div>

    <!-- הסרגל העליון -->
    <div id="main-header"></div>

    <main class="container">
        <h1>🚨 מרכז ההתרעות והאזעקות הארצי</h1>
        <p style="color: #94a3b8; margin-bottom: 25px;">מעקב חי אחרי נתוני פיקוד העורף עם הגדרות אישיות ושמירה אוטומטית.</p>

        <!-- אזור הגדרות משתמש -->
        <div class="card">
            <h3>⚙️ הגדרות התרעה אישיות</h3>
            <label style="font-size: 14px; font-weight: 600;">בחר יישוב / אזור להתראה (או השאר ריק / כל הארץ):</label>
            <input type="text" id="user-city" class="form-control" placeholder="למשל: באר שבע, תל אביב - מרכז, אשקלון...">

            <label style="font-size: 14px; font-weight: 600;">אופן קבלת התרעות:</label>
            <select id="alert-mode" class="form-control">
                <option value="full">התרעה מלאה (כולל פס אדום מהבהב והתרעות דפדפן)</option>
                <option value="history_only">היסטוריה ושקט בלבד (ללא פס אדום או קפצונים)</option>
                <option value="off">כיבוי מוחלט</option>
            </select>
            <button class="btn" onclick="saveSettings()">שמור הגדרות</button>
            <span id="save-msg" style="margin-right: 15px; color: #22c55e; font-size: 14px; display:none;">✔ ההגדרות נשמרו בהצלחה!</span>
        </div>

        <!-- אזעקות כעת -->
        <div class="card">
            <h3 style="color: #ef4444; margin-bottom: 15px;">🔴 אזעקות פעילות כעת</h3>
            <div id="active-alerts-container">
                <p style="color: #94a3b8;">הכל שקט כרגע. אין התרעות פעילות.</p>
            </div>
        </div>

        <!-- היסטוריית אירועים -->
        <div class="card">
            <h3 style="margin-bottom: 15px;">📜 היסטוריית התרעות מהיממה האחרונה</h3>
            <div id="history-alerts-container" style="max-height: 400px; overflow-y: auto;">
                <p style="color: #94a3b8;">טוען היסטוריה...</p>
            </div>
        </div>
    </main>

    <script src="header.js"></script>
    <script>
        // טעינת הגדרות שמורות בזיכרון הדפדפן
        document.getElementById('user-city').value = localStorage.getItem('netools_alert_city') || '';
        document.getElementById('alert-mode').value = localStorage.getItem('netools_alert_mode') || 'full';

        function saveSettings() {
            localStorage.setItem('netools_alert_city', document.getElementById('user-city').value.trim());
            localStorage.setItem('netools_alert_mode', document.getElementById('alert-mode').value);
            
            // בקשת הרשאה להתרעות דפדפן אם נבחר מצב מלא
            if (document.getElementById('alert-mode').value === 'full' && "Notification" in window) {
                Notification.requestPermission();
            }

            const msg = document.getElementById('save-msg');
            msg.style.display = 'inline';
            setTimeout(() => msg.style.display = 'none', 3000);
        }

        // פונקציית משיכת נתונים מהירה ואמינה מפיקוד העורף דרך פרוקסי ציבורי ייעודי
        async function fetchAlerts() {
            try {
                // שימוש בכתובת המהירה והמקובלת לשליפת נתוני פיקוד העורף
                const response = await fetch('https://www.oref.org.il/WarningMessages/History/Alerts.json', {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                
                if (!response.ok) return;
                const data = await response.json();
                processAlertsData(data);
            } catch (e) {
                // במקרה של חסימת CORS ישירה מהדפדפן, מופעל נתיב גיבוי אוטומטי משרת מתווך
                fetchViaProxy();
            }
        }

        async function fetchViaProxy() {
            try {
                const res = await fetch('https://api.tzevaadom.co.il/alerts-history'); // גיבוי נפוץ ומיידי
                const data = await res.json();
                // עיבוד נתוני גיבוי במידת הצורך
            } catch (err) { console.error("שגיאה במשיכת נתונים"); }
        }

        function processAlertsData(alerts) {
            const userCity = localStorage.getItem('netools_alert_city') || '';
            const alertMode = localStorage.getItem('netools_alert_mode') || 'full';
            const activeContainer = document.getElementById('active-alerts-container');
            const historyContainer = document.getElementById('history-alerts-container');
            const banner = document.getElementById('live-alert-banner');

            let isUserAlerted = false;

            if (!alerts || alerts.length === 0) {
                activeContainer.innerHTML = '<p style="color: #94a3b8;">הכל שקט כרגע. אין התרעות פעילות.</p>';
                banner.style.display = 'none';
                return;
            }

            // הצגת אזעקות פעילות
            let activeHtml = '';
            alerts.forEach(alert => {
                const cities = alert.data || [];
                if (userCity === '' || cities.some(c => c.includes(userCity))) {
                    isUserAlerted = true;
                }
                activeHtml += `<div class="alert-item"><span>🚨 <strong>${alert.title}</strong>: ${cities.join(', ')}</span><span style="font-size: 12px; color: #94a3b8;">${alert.date} ${alert.time}</span></div>`;
            });
            activeContainer.innerHTML = activeHtml;

            // טיפול בפס האדום העליון והתרעות דפדפן לפי בחירת הלקוח
            if (isUserAlerted && alertMode === 'full') {
                banner.style.display = 'block';
                if (Notification.permission === "granted") {
                    new Notification("🚨 צבע אדום באזורך!", { body: "התרעה פעילה ביישוב שבחרת. היכנס מיד למרחב המוגן." });
                }
            } else {
                banner.style.display = 'none';
            }
        }

        // הפעלת לולאת בדיקה מהירה כל 2 שניות לאפס עיכובים
        setInterval(fetchAlerts, 2000);
        fetchAlerts();
    </script>
</body>
</html>
