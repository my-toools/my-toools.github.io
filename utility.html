<!-- כרטיסיית המרת מידות נעליים ובגדים -->
<div class="card">
    <h2>מחשבון המרת מידות נעליים ובגדים</h2>
    
    <!-- בחירת קטגוריה -->
    <label>בחרי סוג פריט:</label>
    <select id="sizeCategory" onchange="updateSizeOptions()">
        <option value="shoes">👟 נעליים (אירופאי / אמריקאי / בריטי)</option>
        <option value="clothes_women">👗 בגדי נשים (חולצות, שמלות, מכנסיים)</option>
        <option value="clothes_men">👕 בגדי גברים (חולצות, ז'קטים)</option>
    </select>

    <!-- מידה לבחירה -->
    <label>בחרי מידה אירופאית (EU):</label>
    <select id="sizeSelect" onchange="convertSizes()">
        <!-- יתמלא דינמית על ידי סקריפט -->
    </select>

    <div class="result" id="sizeConvertResult">בחרי מידה להצגת ההמרה</div>
</div>

<script>
    const sizeData = {
        shoes: {
            "36": "US 6 | UK 3.5 | INT Small",
            "37": "US 6.5 | UK 4 | INT Small",
            "38": "US 7.5 | UK 5 | INT Medium",
            "39": "US 8.5 | UK 5.5 | INT Medium",
            "40": "US 9 | UK 6.5 | INT Large",
            "41": "US 9.5 | UK 7 | INT Large",
            "42": "US 10.5 | UK 8 | INT XL",
            "43": "US 11.5 | UK 9 | INT XL"
        },
        clothes_women: {
            "34": "US 2 | UK 6 | INT XS",
            "36": "US 4 | UK 8 | INT S",
            "38": "US 6 | UK 10 | INT M",
            "40": "US 8 | UK 12 | INT L",
            "42": "US 10 | UK 14 | INT XL",
            "44": "US 12 | UK 16 | INT XXL"
        },
        clothes_men: {
            "46": "US/UK 36 | INT S (חזה ~92 ס\"מ)",
            "48": "US/UK 38 | INT M (חזה ~96 ס\"מ)",
            "50": "US/UK 40 | INT L (חזה ~104 ס\"מ)",
            "52": "US/UK 42 | INT XL (חזה ~110 ס\"מ)",
            "54": "US/UK 44 | INT XXL (חזה ~116 ס\"מ)"
        }
    };

    function updateSizeOptions() {
        const cat = document.getElementById('sizeCategory').value;
        const select = document.getElementById('sizeSelect');
        select.innerHTML = '';

        Object.keys(sizeData[cat]).forEach(size => {
            let opt = document.createElement('option');
            opt.value = size;
            opt.innerText = `מידה ${size} (EU)`;
            select.appendChild(opt);
        });

        convertSizes();
    }

    function convertSizes() {
        const cat = document.getElementById('sizeCategory').value;
        const val = document.getElementById('sizeSelect').value;
        const res = sizeData[cat][val];
        document.getElementById('sizeConvertResult').innerText = `מידה מקבילה: ${res}`;
    }

    // הפעלה ראשונית
    updateSizeOptions();
</script>
